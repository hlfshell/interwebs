name: Verify interweb
on: [push, pull_request]
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev ffmpeg
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: go test -race -timeout 180s ./internal/... ./cmd/...
      - run: node --test scripts/remote-lifecycle.test.mjs
      - run: go build -tags desktop,production,webkit2_41 -o build/bin/ ./...
      - if: runner.os == 'Linux'
        run: npx --prefix frontend playwright install --with-deps chromium firefox webkit
      - if: runner.os == 'Linux'
        run: npm test --prefix frontend
      - uses: actions/upload-artifact@v4
        with:
          name: interweb-${{ runner.os }}
          path: build/bin/
